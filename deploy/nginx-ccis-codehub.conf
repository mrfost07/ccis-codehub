# CCIS-CodeHub Nginx Configuration
# Copy to: /etc/nginx/sites-available/ccis-codehub
#
# TLS: this file is HTTP-only on purpose. Run certbot AFTER installing it and
# it will inject the `listen 443 ssl` blocks, certificate paths, and the
# HTTP->HTTPS redirect automatically:
#
#     sudo certbot --nginx -d ccis-codehub.space -d www.ccis-codehub.space
#
# Until certbot has run, keep SECURE_SSL_REDIRECT=False in the backend .env,
# otherwise Django redirects to an https:// port that isn't listening.

# WebSocket upgrade mapping — `$connection_upgrade` is "upgrade" for WS
# handshakes and "close" otherwise. Must live at http{} scope.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Frontend - Main domain
server {
    listen 80;
    server_name ccis-codehub.space www.ccis-codehub.space;

    root /home/deploy/CCIS-CodeHub/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Let certbot answer the ACME challenge over plain HTTP
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Frontend routing (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must revalidate on every request.
    #
    # It was served with only ETag and Last-Modified and no Cache-Control, so
    # browsers fell back to heuristic caching and held it for hours. The hashed
    # assets beside it are immutable for a year, so a stale index keeps asking for
    # last week's chunks — which are still on disk and still immutable — and the
    # app silently runs an old build after a deploy. Observed directly: production
    # was serving index-BvFD9Ej-.js while a browser kept running index-DYCgYlQs.js
    # and none of the deployed fixes appeared.
    #
    # `no-cache` means revalidate, not "do not store" — the 304 is a few bytes.
    # The `always` flag keeps the header on 304 responses, which is exactly the
    # case that matters here.
    #
    # Safe as a nested add_header only because this server block declares no
    # others; nginx drops inherited add_header directives as soon as a child
    # block adds one of its own.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ----------------------------------------------------------------------
    # WebSocket proxy — REQUIRED for live quizzes, the instructor monitor and
    # violation reporting. Without this block /ws/ falls through to the SPA
    # `location /` and the handshake never upgrades, so every socket fails.
    # The frontend connects to wss://<host>/ws (VITE_WS_URL).
    # ----------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Quiz sockets idle between questions — don't cut them off.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # API proxy (for same-domain API calls)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Django admin + DRF browsable API (served by the same backend)
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media files
    location /media/ {
        alias /home/deploy/CCIS-CodeHub/backend/media/;
        expires 7d;
    }

    # Static files from Django
    location /static/ {
        alias /home/deploy/CCIS-CodeHub/backend/staticfiles/;
        expires 7d;
    }
}

# API subdomain (optional - for dedicated API access)
server {
    listen 80;
    server_name api.ccis-codehub.space;

    client_max_body_size 50M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # WebSocket upgrade on the API subdomain too
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /home/deploy/CCIS-CodeHub/backend/staticfiles/;
    }

    location /media/ {
        alias /home/deploy/CCIS-CodeHub/backend/media/;
    }
}
