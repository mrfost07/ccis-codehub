<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 600 20px Arial, sans-serif; fill: #374151; }
      .section { font: 700 28px Arial, sans-serif; fill: #111827; }
      .body { font: 500 18px Arial, sans-serif; fill: #1f2937; }
      .small { font: 600 16px Arial, sans-serif; fill: #374151; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <polygon points="0,0 14,7 0,14" fill="#374151" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="#f8fafc" />

  <text x="800" y="55" text-anchor="middle" class="title">Figure 1. IPO Conceptual Framework of CCIS-CodeHub</text>
  <text x="800" y="90" text-anchor="middle" class="subtitle">Input-Process-Output Model for an AI-Driven, Integrity-Aware Academic Platform</text>

  <rect x="70" y="150" rx="18" ry="18" width="430" height="710" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
  <rect x="585" y="150" rx="18" ry="18" width="430" height="710" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  <rect x="1100" y="150" rx="18" ry="18" width="430" height="710" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>

  <text x="285" y="205" text-anchor="middle" class="section">INPUT</text>
  <text x="800" y="205" text-anchor="middle" class="section">PROCESS</text>
  <text x="1315" y="205" text-anchor="middle" class="section">OUTPUT</text>

  <line x1="500" y1="505" x2="565" y2="505" stroke="#374151" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1015" y1="505" x2="1080" y2="505" stroke="#374151" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="105" y="240" rx="12" ry="12" width="360" height="135" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="125" y="275" class="small">Core Academic Problems</text>
  <text x="125" y="305" class="body">- Tool fragmentation</text>
  <text x="125" y="333" class="body">- Employability gaps</text>
  <text x="125" y="361" class="body">- AI dependence</text>

  <rect x="105" y="395" rx="12" ry="12" width="360" height="135" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="125" y="430" class="small">Integrity and Evaluation Needs</text>
  <text x="125" y="460" class="body">- Academic-integrity risks</text>
  <text x="125" y="488" class="body">- System-performance evaluation</text>
  <text x="125" y="516" class="body">- Quality and accountability needs</text>

  <rect x="105" y="550" rx="12" ry="12" width="360" height="135" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="125" y="585" class="small">Stakeholders and Content Inputs</text>
  <text x="125" y="615" class="body">- Students, instructors, administrators</text>
  <text x="125" y="643" class="body">- Curriculum materials and documents</text>
  <text x="125" y="671" class="body">- Project and assessment requirements</text>

  <rect x="105" y="705" rx="12" ry="12" width="360" height="120" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="125" y="740" class="small">Technical Resources</text>
  <text x="125" y="770" class="body">- AI model providers and APIs</text>
  <text x="125" y="798" class="body">- Camera-enabled assessment devices</text>
  <text x="125" y="826" class="body">- Selected software stack</text>

  <rect x="620" y="240" rx="12" ry="12" width="360" height="120" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="640" y="275" class="small">Analysis and Design</text>
  <text x="640" y="305" class="body">- Requirements analysis</text>
  <text x="640" y="333" class="body">- Platform and interface design</text>
  <text x="640" y="361" class="body">- Database and API modeling</text>

  <rect x="620" y="380" rx="12" ry="12" width="360" height="120" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="640" y="415" class="small">Core System Development</text>
  <text x="640" y="445" class="body">- Frontend and backend implementation</text>
  <text x="640" y="473" class="body">- Community and collaboration design</text>
  <text x="640" y="501" class="body">- Real-time event handling</text>

  <rect x="620" y="520" rx="12" ry="12" width="360" height="120" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="640" y="555" class="small">AI and Integrity Integration</text>
  <text x="640" y="585" class="body">- Contextual AI integration</text>
  <text x="640" y="613" class="body">- Curriculum-aware content extraction</text>
  <text x="640" y="641" class="body">- Camera-assisted assessment flow</text>

  <rect x="620" y="660" rx="12" ry="12" width="360" height="165" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="640" y="695" class="small">Testing and Evaluation Planning</text>
  <text x="640" y="725" class="body">- Iterative testing and refinement</text>
  <text x="640" y="753" class="body">- Software-quality evaluation planning</text>
  <text x="640" y="781" class="body">- Responsiveness and reliability checks</text>
  <text x="640" y="809" class="body">- AI-support relevance assessment</text>

  <rect x="1135" y="240" rx="12" ry="12" width="360" height="135" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
  <text x="1155" y="275" class="small">Integrated Learning Ecosystem</text>
  <text x="1155" y="305" class="body">- Structured learning environment</text>
  <text x="1155" y="333" class="body">- Coding and video-based content</text>
  <text x="1155" y="361" class="body">- Connected academic workflows</text>

  <rect x="1135" y="395" rx="12" ry="12" width="360" height="120" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
  <text x="1155" y="430" class="small">Collaborative and Community Outputs</text>
  <text x="1155" y="460" class="body">- Project workspace</text>
  <text x="1155" y="488" class="body">- Community-based support layer</text>
  <text x="1155" y="516" class="body">- Peer interaction and sharing</text>

  <rect x="1135" y="535" rx="12" ry="12" width="360" height="120" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
  <text x="1155" y="570" class="small">AI and Integrity Outputs</text>
  <text x="1155" y="600" class="body">- Contextual AI mentor</text>
  <text x="1155" y="628" class="body">- Integrity-aware assessment flow</text>
  <text x="1155" y="656" class="body">- Proctoring-ready monitoring framework</text>

  <rect x="1135" y="675" rx="12" ry="12" width="360" height="150" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
  <text x="1155" y="710" class="small">Evaluation-Oriented Output</text>
  <text x="1155" y="740" class="body">- Basis for system-performance evaluation</text>
  <text x="1155" y="768" class="body">- Measurable software quality indicators</text>
  <text x="1155" y="796" class="body">- Connected and accountable digital platform</text>
</svg>
