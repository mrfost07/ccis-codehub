  <line x1="1155" y1="400" x2="885" y2="700" stroke="#c2410c" stroke-width="2.5"/>

  <text x="650" y="815" text-anchor="middle" class="caption">Caption: The use case diagram presents the major interactions of students, instructors, and administrators with the core modules of CCIS-CodeHub.</text>
