  <rect x="0" y="0" width="1300" height="860" fill="#fffaf5"/>
  <text x="650" y="42" text-anchor="middle" class="title">Figure 2. Use Case Diagram of CCIS-CodeHub</text>

  <rect x="255" y="92" rx="16" ry="16" width="790" height="650" fill="#ffffff" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
