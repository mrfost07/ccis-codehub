<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="860" viewBox="0 0 1300 860">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #7c2d12; }
      .system { font: 700 22px Arial, sans-serif; fill: #9a3412; }
      .actor { font: 700 16px Arial, sans-serif; fill: #7c2d12; }
      .usecase { font: 600 14px Arial, sans-serif; fill: #431407; }
      .caption { font: 600 14px Arial, sans-serif; fill: #7c2d12; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7c2d12" flood-opacity="0.12"/>
    </filter>
