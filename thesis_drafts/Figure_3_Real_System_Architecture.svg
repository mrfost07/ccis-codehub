<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #7c2d12; }
      .group { font: 700 18px Arial, sans-serif; fill: #9a3412; }
      .label { font: 700 15px Arial, sans-serif; fill: #431407; }
      .text { font: 500 13px Arial, sans-serif; fill: #431407; }
      .caption { font: 600 14px Arial, sans-serif; fill: #7c2d12; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7c2d12" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <polygon points="0,0 14,7 0,14" fill="#c2410c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="860" fill="#fffaf5"/>
  <text x="700" y="42" text-anchor="middle" class="title">Figure 3. Real System Architecture of CCIS-CodeHub</text>

  <rect x="60" y="120" rx="16" ry="16" width="170" height="150" fill="#ffffff" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
  <text x="145" y="150" text-anchor="middle" class="group">USER DEVICES</text>
  <text x="145" y="188" text-anchor="middle" class="label">Web Browser</text>
  <text x="145" y="214" text-anchor="middle" class="label">Mobile Device</text>
  <text x="145" y="242" text-anchor="middle" class="text">Students</text>
  <text x="145" y="260" text-anchor="middle" class="text">Instructors | Admin</text>

  <rect x="280" y="120" rx="16" ry="16" width="190" height="150" fill="#ffffff" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
  <text x="375" y="150" text-anchor="middle" class="group">FRONTEND APP</text>
  <text x="375" y="186" text-anchor="middle" class="label">React 18 + TypeScript</text>
  <text x="375" y="212" text-anchor="middle" class="text">Dashboards, Learning, Projects,</text>
  <text x="375" y="230" text-anchor="middle" class="text">Community, AI Mentor, Live Quiz,</text>
  <text x="375" y="248" text-anchor="middle" class="text">Coding, Video Pages</text>

  <rect x="520" y="90" rx="18" ry="18" width="520" height="330" fill="#ffffff" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
  <text x="780" y="122" text-anchor="middle" class="group">BACKEND APPLICATION SERVER</text>
  <text x="780" y="148" text-anchor="middle" class="label">Django 4.2 + Django REST Framework</text>
  <text x="780" y="170" text-anchor="middle" class="text">JWT Authentication | REST API | Role-Based Access Control</text>

  <rect x="555" y="195" rx="12" ry="12" width="135" height="62" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="622" y="220" text-anchor="middle" class="label">Accounts</text>
  <text x="622" y="241" text-anchor="middle" class="text">auth, profile, role</text>

  <rect x="710" y="195" rx="12" ry="12" width="135" height="62" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="777" y="220" text-anchor="middle" class="label">Learning</text>
  <text x="777" y="241" text-anchor="middle" class="text">paths, quizzes, videos</text>

  <rect x="865" y="195" rx="12" ry="12" width="140" height="62" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="935" y="220" text-anchor="middle" class="label">Projects</text>
  <text x="935" y="241" text-anchor="middle" class="text">teams, tasks, sync</text>

  <rect x="555" y="280" rx="12" ry="12" width="135" height="62" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="622" y="305" text-anchor="middle" class="label">Community</text>
  <text x="622" y="326" text-anchor="middle" class="text">posts, chat, follows</text>

  <rect x="710" y="280" rx="12" ry="12" width="135" height="62" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="777" y="305" text-anchor="middle" class="label">AI Mentor</text>
  <text x="777" y="326" text-anchor="middle" class="text">guidance, recommendations</text>

  <rect x="865" y="280" rx="12" ry="12" width="140" height="62" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="935" y="305" text-anchor="middle" class="label">AI Proctor</text>
  <text x="935" y="326" text-anchor="middle" class="text">frame analysis flow</text>

  <rect x="635" y="355" rx="12" ry="12" width="290" height="42" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="780" y="381" text-anchor="middle" class="label">PDF / DOCX Extractor and Curriculum-Aware Processing</text>

  <rect x="1090" y="120" rx="16" ry="16" width="230" height="150" fill="#ffffff" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
  <text x="1205" y="150" text-anchor="middle" class="group">REAL-TIME SERVICE</text>
  <text x="1205" y="186" text-anchor="middle" class="label">Django Channels + Daphne</text>
  <text x="1205" y="212" text-anchor="middle" class="text">Notifications</text>
  <text x="1205" y="230" text-anchor="middle" class="text">Live Quiz Sessions</text>
  <text x="1205" y="248" text-anchor="middle" class="text">Proctoring Frame Stream</text>

  <rect x="420" y="530" rx="16" ry="16" width="180" height="120" fill="#ffffff" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
  <text x="510" y="560" text-anchor="middle" class="group">POSTGRESQL</text>
  <text x="510" y="595" text-anchor="middle" class="text">Primary relational database</text>
  <text x="510" y="613" text-anchor="middle" class="text">users, learning, projects,</text>
  <text x="510" y="631" text-anchor="middle" class="text">community, AI, quiz records</text>

  <rect x="650" y="530" rx="16" ry="16" width="180" height="120" fill="#ffffff" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
  <text x="740" y="560" text-anchor="middle" class="group">REDIS</text>
  <text x="740" y="595" text-anchor="middle" class="text">cache</text>
  <text x="740" y="613" text-anchor="middle" class="text">message broker</text>
  <text x="740" y="631" text-anchor="middle" class="text">channel layer</text>

  <rect x="880" y="530" rx="16" ry="16" width="180" height="120" fill="#ffffff" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
  <text x="970" y="560" text-anchor="middle" class="group">CELERY</text>
  <text x="970" y="595" text-anchor="middle" class="text">worker</text>
  <text x="970" y="613" text-anchor="middle" class="text">beat scheduler</text>
  <text x="970" y="631" text-anchor="middle" class="text">background tasks</text>

  <rect x="1110" y="510" rx="16" ry="16" width="250" height="140" fill="#ffffff" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
  <text x="1235" y="540" text-anchor="middle" class="group">EXTERNAL SERVICES</text>
  <text x="1235" y="575" text-anchor="middle" class="text">Google OAuth</text>
  <text x="1235" y="593" text-anchor="middle" class="text">GitHub API</text>
  <text x="1235" y="611" text-anchor="middle" class="text">Gemini | OpenRouter</text>
  <text x="1235" y="629" text-anchor="middle" class="text">OpenAI | Mistral</text>

  <line x1="230" y1="195" x2="280" y2="195" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="470" y1="195" x2="520" y2="195" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1040" y1="195" x2="1090" y2="195" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="610" y1="420" x2="610" y2="530" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="740" y1="420" x2="740" y2="530" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="900" y1="420" x2="970" y2="530" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1020" y1="300" x2="1180" y2="510" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="970" y1="650" x2="970" y2="700" stroke="#c2410c" stroke-width="0"/>
  <line x1="970" y1="530" x2="830" y2="590" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="700" y="810" text-anchor="middle" class="caption">Caption: The real system architecture of CCIS-CodeHub presents the major runtime objects of the platform, including user devices, the React frontend, the Django backend application server, the real-time WebSocket service, the database, Redis, Celery background processing, and external integration services.</text>
</svg>
